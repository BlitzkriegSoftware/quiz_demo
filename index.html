<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blitzkrieg Software Blank Page</title>

    <!-- Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- Reset Font -->
    <style>
      body {
        font-family: "Roboto", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings: "wdth" 100;
      }
      .bump-down-5 {
        margin-top: 10px;
      }
      .quizbody {
        font-size: 1.1em;
      }
      .quizquestion {
        font-weight: bold;
      }
      .quizanswers {
        margin-left: 8px;
      }
      .quizover {
        font-weight: bold;
        color: green;
      }
    </style>
  </head>
  <body>
    <!-- Main Container -->
    <div class="container">
      <h2>Quiz</h2>
      <form>
        <div class="btn-group" role="group">
          <button
            id="newgame"
            hx-post="/new"
            hx-trigger="click"
            hx-include="#bdone"
            hx-include="#nextq"
            hx-include="#score"
            hx-target="#result"
            class="btn btn-secondary actionbutton"
          >
            New Game
          </button>
          <button
            id="print"
            hx-get="/print"
            hx-include="#bdone"
            hx-include="#nextq"
            hx-include="#score"
            hx-target="#result"
            class="btn btn-secondary actionbutton"
          >
            Print
          </button>
        </div>
      </form>

      <div id="result"></div>
      <input type="hidden" id="bdone" value="0" />
      <input type="hidden" id="nextq" value="0" />
      <input type="hidden" id="score" value="0" />
      <!-- if you change the port correct this line -->
      <input type="hidden" id="baseurl" value="http://localhost:8084" />
    </div>

    <script>
      document.addEventListener("htmx:afterRequest", function (event) {
        json = event.detail.xhr.getResponseHeader("HX-Trigger");
        if (json != null) {
          obj = JSON.parse(json);
          document.getElementById("bdone").value = obj.bdone;
          document.getElementById("nextq").value = obj.nextq;
          document.getElementById("score").value = obj.score;
        }
      });
      window.addEventListener("load", (event) => {
        baseurl = document.getElementById("baseurl").value;
        const buttons = document.querySelectorAll("button.actionbutton");
        buttons.forEach((button) => {
          for (const attr of button.attributes) {
            // console.log(`${attr.name} = ${attr.value}`);
            switch (attr.name.toLowerCase()) {
              case "hx-get":
              case "hx-post":
              case "hx-put":
              case "hx-delete":
                if (!attr.value.includes("http")) {
                  newUrl = baseurl + attr.value;
                  button.setAttribute(attr.name, newUrl);
                }
                break;
            }
          }
        });
      });
    </script>
    <!-- Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- HTMLX -->
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
