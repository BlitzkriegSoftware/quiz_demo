<!doctype html>
<html lang="en">
  <head>
    <!-- if you change the port change this -->
    <base href="http://localhost:8084" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blitzkrieg Software: Quiz in HTMX and FastAPI</title>

    <!-- Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- My in page styles -->
    <style>
      body {
        font-family: "Roboto", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings: "wdth" 100;
      }
      .bump-down-5 {
        margin-top: 10px;
      }
      .quizbody {
        font-size: 1.1em;
      }
      .quizquestion {
        font-weight: bold;
      }
      .quizanswers {
        margin-left: 8px;
      }
      .quizover {
        font-weight: bold;
        color: green;
      }
      .actionbutton {
        margin: 8px 0 8px 0;
      }
      .text-end {
        vertical-align: middle;
      }
      .debugtext {
        font-weight: lighter;
      }
    </style>
  </head>
  <body>
    <!-- Main Container -->
    <div class="container">
      <h2>Quiz</h2>
      <form>
        <div class="btn-group" role="group">
          <button
            id="newgame"
            hx-post="new"
            hx-include="#bdone, #nextq, #score"
            hx-target="#result"
            class="btn btn-primary actionbutton"
          >
            New Game
          </button>
        </div>
        <div class="btn-group" role="group">
          <button
            id="print"
            hx-get="print"
            hx-include="#bdone, #nextq, #score"
            hx-target="#result"
            class="btn btn-secondary actionbutton d-none"
          >
            Print
          </button>
        </div>
        <div class="btn-group" role="group">
          <button id="scoreButton" class="btn btn-info actionbutton" disabled>
            Score: <span id="dscore">0</span>
          </button>
        </div>
      </form>
      <div id="debug" class="debugtext"></div>
      <div id="result"></div>
      <div id="vars">
        <input type="hidden" id="bdone" name="bdone" value="0" />
        <input type="hidden" id="nextq" name="nextq" value="0" />
        <input type="hidden" id="score" name="score" value="0" />
      </div>
    </div>

    <script>
      const doDebug = false;
      document.addEventListener("htmx:afterRequest", function (event) {
        json = event.detail.xhr.getResponseHeader("HX-Trigger");
        if (json != null) {
          obj = JSON.parse(json);
          document.getElementById("bdone").value = obj.updateState.bdone;
          document.getElementById("nextq").value = obj.updateState.nextq;
          document.getElementById("score").value = obj.updateState.score;

          document.getElementById("dscore").innerText = obj.updateState.score;
          if (doDebug) {
            document.getElementById("debug").innerText =
              "bdone: " +
              obj.updateState.bdone +
              ", nextq: " +
              obj.updateState.nextq +
              ", score: " +
              obj.updateState.score;
          }
        }
      });
      window.addEventListener("load", (event) => {});
    </script>
    <!-- Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- HTMX -->
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
