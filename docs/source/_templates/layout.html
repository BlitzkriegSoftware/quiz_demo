{% extends "!layout.html" %} {% block extrahead %} {{ super() }}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Finds the literal span within the navbar-brand div
    var brandSpan = document.querySelector(".navbar-brand span");
    if (brandSpan) {
      brandSpan.textContent = "Blitzkrieg Software";
    }
    var logoImg = document.querySelector("#cs-nav img");
    if (logoImg) {
      logoImg.src = "_static/blogo.svg";
      logoImg.alt = "Blitzkrieg Software Logo";
    }
  });
</script>
{% endblock %}
